<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>igvc dev harness</title>
    <!-- In the real extension this is injected by the manifest. -->
    <link rel="stylesheet" href="/content.css" />
    <style>
      body {
        margin: 0;
        background: #fafafa;
        color: #111;
        font: 14px/1.4 system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      #spacer { height: 0; flex: none; }
      /* Mimics Instagram's structure: a wrapper holding the video plus
         click-catcher and control siblings stacked on top of it. */
      .post {
        width: 480px;
        background: #fff;
        border: 1px solid #dbdbdb;
        border-radius: 8px;
        overflow: hidden;
      }
      .media {
        position: relative;
        width: 480px;
        height: 600px;
        background: #000;
      }
      .media video,
      .media .frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Stands in for decoded frames so seeking is visible in a screenshot. */
      .frame {
        display: flex;
        align-items: center;
        justify-content: center;
        font: bold 72px ui-monospace, monospace;
        color: #fff;
        background: #22304a;
      }
      .catcher { position: absolute; inset: 0; z-index: 5; cursor: pointer; }
      .ig-mute {
        position: absolute;
        right: 12px; bottom: 12px;
        z-index: 6;
        width: 30px; height: 30px;
        border-radius: 50%;
        border: 0;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        cursor: pointer;
      }

      /* The post modal, which Instagram renders OVER a still-mounted feed. */
      #modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
      }
      #modal.open { display: flex; }
      #modal .media { width: 520px; height: 640px; }

      #log {
        width: 480px;
        min-height: 54px;
        font: 12px/1.5 ui-monospace, monospace;
        background: #111;
        color: #7cff9b;
        padding: 10px;
        border-radius: 6px;
        white-space: pre-wrap;
      }
      #status { font: 12px ui-monospace, monospace; color: #555; }
    </style>
  </head>
  <body>
    <div id="status">ready</div>
    <div id="spacer"></div>

    <div class="post">
      <div class="media" id="media">
        <div class="frame" id="frame">0.0s</div>
        <video id="v" playsinline></video>
        <div class="catcher" id="catcher"></div>
        <button class="ig-mute" id="igmute">M</button>
      </div>
    </div>

    <div id="log">leak log (must stay empty when clicking our bar)</div>

    <!-- Larger in area than the feed video on purpose: a hit test that picks
         the smallest match would choose the wrong one. -->
    <div id="modal">
      <div class="media" id="media2">
        <div class="frame" id="frame2">0.0s</div>
        <video id="v2" playsinline></video>
        <div class="catcher" id="catcher2"></div>
      </div>
    </div>

    <script>
      const log = (msg) => {
        document.getElementById("log").textContent += "\n" + msg;
        console.log("[harness]", msg);
      };

      // --- Instagram's own handlers. Any of these firing while we use the
      // --- control bar means our event isolation is broken.
      document.getElementById("catcher").addEventListener("click", () => log("LEAK: catcher click"));
      document.getElementById("media").addEventListener("click", () => log("LEAK: media click"));
      document.addEventListener("keydown", () => log("LEAK: document keydown"));
      document.getElementById("igmute").addEventListener("click", (e) => {
        e.stopPropagation();
        const v = document.getElementById("v");
        v.muted = !v.muted;
        log("IG mute button -> muted=" + v.muted);
      });

      // --- Fake media clock -------------------------------------------------
      // Brave will not decode a MediaRecorder blob, and a real codec is not what
      // we are testing. The extension only ever touches duration / currentTime /
      // paused / buffered / play() / pause() and the matching events, so we
      // shadow exactly those and leave volume + muted native.
      function fakeClock(v, frame, DURATION) {
        let time = 0, paused = true, ticker = null;
        const def = (name, desc) => Object.defineProperty(v, name, { configurable: true, ...desc });
        const render = () => {
          frame.textContent = time.toFixed(1) + "s";
          frame.style.background = `hsl(${Math.round((time / DURATION) * 300)} 45% 28%)`;
        };

        def("duration", { get: () => DURATION });
        def("paused", { get: () => paused });
        def("readyState", { get: () => 4 });
        def("buffered", { get: () => ({ length: 1, start: () => 0, end: () => Math.min(DURATION, time + 6) }) });
        def("currentTime", {
          get: () => time,
          set: (t) => {
            time = Math.min(DURATION, Math.max(0, Number(t) || 0));
            render();
            v.dispatchEvent(new Event("seeking"));
            v.dispatchEvent(new Event("seeked"));
            v.dispatchEvent(new Event("timeupdate"));
          },
        });
        def("play", {
          value: () => {
            if (!paused) return Promise.resolve();
            paused = false;
            v.dispatchEvent(new Event("play"));
            v.dispatchEvent(new Event("playing"));
            ticker = setInterval(() => {
              time = Math.min(DURATION, time + 0.1);
              render();
              v.dispatchEvent(new Event("timeupdate"));
              if (time >= DURATION) v.pause();
            }, 100);
            return Promise.resolve();
          },
        });
        def("pause", {
          value: () => {
            if (paused) return;
            paused = true;
            clearInterval(ticker);
            v.dispatchEvent(new Event("pause"));
          },
        });

        render();
        v.dispatchEvent(new Event("loadedmetadata"));
        return { reset: () => { time = 0; paused = true; clearInterval(ticker); render(); } };
      }

      const feed = fakeClock(document.getElementById("v"), document.getElementById("frame"), 30);
      const modal = fakeClock(document.getElementById("v2"), document.getElementById("frame2"), 12);

      // --- Driver hooks -----------------------------------------------------
      window.__openModal = () => document.getElementById("modal").classList.add("open");
      window.__closeModal = () => document.getElementById("modal").classList.remove("open");
      window.__setSpacer = (px) => { document.getElementById("spacer").style.height = px + "px"; };
      window.__resetLog = () => { document.getElementById("log").textContent = "leak log"; };

      // Counts real animation frames so we can prove the bar's loop parks when
      // it has nothing to draw, instead of running a forced layout forever.
      window.__rafCount = 0;
      const nativeRaf = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = (cb) => { window.__rafCount++; return nativeRaf(cb); };
      // Uncounted, so the driver can tick real frames without polluting the
      // number it is measuring — and can tell "loop parked" from "tab hidden".
      window.__nativeRaf = nativeRaf;
      // Always settles: in a hidden tab rAF never fires, and an unguarded await
      // here hangs the driver for 45s looking exactly like a renderer freeze.
      // nativeFrames === 0 in the result means "inconclusive", not "parked".
      window.__countOverFrames = (frames, timeoutMs = 2000) => {
        const before = window.__rafCount;
        let native = 0;
        const finish = () => ({ extensionFrames: window.__rafCount - before, nativeFrames: native });
        return new Promise((done) => {
          const timer = setTimeout(() => done(finish()), timeoutMs);
          const step = () => {
            if (++native >= frames) { clearTimeout(timer); return done(finish()); }
            nativeRaf(step);
          };
          nativeRaf(step);
        });
      };

      window.__probe = () => ({
        feed: { t: Number(document.getElementById("v").currentTime.toFixed(2)), paused: document.getElementById("v").paused, muted: document.getElementById("v").muted, volume: Number(document.getElementById("v").volume.toFixed(2)) },
        modalVid: { t: Number(document.getElementById("v2").currentTime.toFixed(2)), paused: document.getElementById("v2").paused, muted: document.getElementById("v2").muted },
        leaks: document.getElementById("log").textContent.split("\n").filter((l) => l.startsWith("LEAK")),
        overlay: (() => {
          const host = document.querySelector("igvc-overlay");
          if (!host) return null;
          const r = host.getBoundingClientRect();
          const sr = host.shadowRoot;
          return {
            rect: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)],
            visible: sr.querySelector(".wrap").classList.contains("on"),
            parent: host.parentElement.tagName + (host.parentElement.id ? "#" + host.parentElement.id : ""),
            time: sr.querySelector(".cur").textContent + " / " + sr.querySelector(".dur").textContent,
            seekDisabled: sr.querySelector(".seek").classList.contains("disabled"),
          };
        })(),
        rects: {
          feed: (() => { const r = document.getElementById("v").getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; })(),
          modal: (() => { const r = document.getElementById("v2").getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; })(),
        },
      });
    </script>
    <script src="/content.js"></script>
  </body>
</html>
