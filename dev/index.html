<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>igvc dev harness</title>
    <!-- In the real extension this is injected by the manifest. -->
    <link rel="stylesheet" href="/content.css" />
    <style>
      body {
        margin: 0;
        background: #fafafa;
        color: #111;
        font: 14px/1.4 system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      #spacer { height: 0; flex: none; }
      /* Mimics Instagram's structure: a wrapper holding the video plus
         click-catcher and control siblings stacked on top of it. */
      .post {
        display: block;
        width: 480px;
        background: #fff;
        border: 1px solid #dbdbdb;
        border-radius: 8px;
        overflow: hidden;
      }
      .media {
        position: relative;
        width: 480px;
        height: 600px;
        background: #000;
      }
      .media video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .catcher { position: absolute; inset: 0; z-index: 5; cursor: pointer; }
      .ig-mute {
        position: absolute;
        right: 12px; bottom: 12px;
        z-index: 6;
        width: 30px; height: 30px;
        border-radius: 50%;
        border: 0;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        cursor: pointer;
      }

      /* The post modal, which Instagram renders OVER a still-mounted feed.
         Its video is deliberately LARGER in area than the feed one, so a hit
         test that picks the smallest match chooses wrong. */
      #modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
      }
      #modal.open { display: flex; }
      #modal .media { width: 520px; height: 640px; }

      #log {
        width: 480px;
        min-height: 54px;
        font: 12px/1.5 ui-monospace, monospace;
        background: #111;
        color: #7cff9b;
        padding: 10px;
        border-radius: 6px;
        white-space: pre-wrap;
      }
      #status { font: 12px ui-monospace, monospace; color: #555; }
    </style>
  </head>
  <body>
    <div id="status">loading clip…</div>
    <div id="spacer"></div>

    <!-- Instagram wraps posts in a link to the reel. It is the reason a click
         anywhere in fullscreen navigated: our bar is moved inside the
         fullscreen element, i.e. inside this anchor, and stopPropagation()
         does not stop an ancestor anchor's default action. -->
    <a class="post" id="postlink" href="/reel/FAKE/">
      <div class="media" id="media">
        <video id="v" src="/clip.webm" preload="auto" playsinline></video>
        <div class="catcher" id="catcher"></div>
        <button class="ig-mute" id="igmute">M</button>
      </div>
    </a>

    <div id="log">leak log (must stay empty when clicking our bar)</div>

    <div id="modal">
      <div class="media" id="media2">
        <video id="v2" src="/clip.webm" preload="auto" playsinline></video>
        <div class="catcher" id="catcher2"></div>
      </div>
    </div>

    <script>
      const v = document.getElementById("v");
      const v2 = document.getElementById("v2");
      const log = (msg) => {
        document.getElementById("log").textContent += "\n" + msg;
        console.log("[harness]", msg);
      };

      // --- Instagram's own handlers. Any of these firing while we use the
      // --- control bar means our event isolation is broken.
      // Models the anchor's default action without ever leaving the page. It
      // only fires if the event reached the anchor AND nothing called
      // preventDefault — which is exactly the condition for a real navigation.
      const postlink = document.getElementById("postlink");
      postlink.addEventListener("click", (e) => {
        if (!e.defaultPrevented) log("LEAK: would navigate to " + postlink.getAttribute("href"));
        e.preventDefault();
      });

      document.getElementById("catcher").addEventListener("click", () => log("LEAK: catcher click"));
      document.getElementById("media").addEventListener("click", () => log("LEAK: media click"));
      document.addEventListener("keydown", () => log("LEAK: document keydown"));
      document.getElementById("igmute").addEventListener("click", (e) => {
        e.stopPropagation();
        v.muted = !v.muted;
        log("IG mute button -> muted=" + v.muted);
      });

      // Real media, deliberately. duration / currentTime / paused are DOM state
      // and are therefore visible to the extension's isolated world; properties
      // shadowed onto the element from here would not be (LESSONS §6.1).
      const ready = (el) =>
        el.readyState >= 1
          ? Promise.resolve()
          : new Promise((res) => {
              el.addEventListener("loadedmetadata", res, { once: true });
              el.addEventListener("error", res, { once: true });
            });

      window.__ready = Promise.all([ready(v), ready(v2)]).then(() => {
        const ok = v.readyState >= 1 && v2.readyState >= 1;
        document.getElementById("status").textContent = ok
          ? `clip ready — ${v.duration.toFixed(2)}s. Hover the video.`
          : "CLIP FAILED TO LOAD — run: npm run fixture";
        return ok;
      });

      // --- Driver hooks -----------------------------------------------------
      window.__openModal = () => document.getElementById("modal").classList.add("open");
      window.__closeModal = () => document.getElementById("modal").classList.remove("open");
      window.__setSpacer = (px) => { document.getElementById("spacer").style.height = px + "px"; };
      window.__resetLog = () => { document.getElementById("log").textContent = "leak log"; };

      // Counts animation frames requested by the bundle. Only meaningful when
      // the bundle runs in THIS world (the localhost harness) — as a real
      // extension it has its own isolated `window` and this patch cannot see it.
      window.__rafCount = 0;
      const nativeRaf = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = (cb) => { window.__rafCount++; return nativeRaf(cb); };
      window.__nativeRaf = nativeRaf;
      // Always settles: in a hidden tab rAF never fires, and an unguarded await
      // here hangs the driver for 45s looking exactly like a renderer freeze.
      // nativeFrames === 0 in the result means "inconclusive", not "parked".
      window.__countOverFrames = (frames, timeoutMs = 2000) => {
        const before = window.__rafCount;
        let native = 0;
        const finish = () => ({ extensionFrames: window.__rafCount - before, nativeFrames: native });
        return new Promise((done) => {
          const timer = setTimeout(() => done(finish()), timeoutMs);
          const step = () => {
            if (++native >= frames) { clearTimeout(timer); return done(finish()); }
            nativeRaf(step);
          };
          nativeRaf(step);
        });
      };

      const snap = (el) => ({
        t: Number(el.currentTime.toFixed(2)),
        paused: el.paused,
        muted: el.muted,
        volume: Number(el.volume.toFixed(2)),
        duration: Number.isFinite(el.duration) ? Number(el.duration.toFixed(2)) : null,
      });
      const box = (el) => { const r = el.getBoundingClientRect();
        return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; };

      window.__probe = () => ({
        feed: snap(v),
        modalVid: snap(v2),
        leaks: document.getElementById("log").textContent.split("\n").filter((l) => l.startsWith("LEAK")),
        overlay: (() => {
          const host = document.querySelector("igvc-overlay");
          if (!host) return null;
          const sr = host.shadowRoot;
          return {
            rect: box(host),
            visible: sr.querySelector(".wrap").classList.contains("on"),
            parent: host.parentElement.tagName + (host.parentElement.id ? "#" + host.parentElement.id : ""),
            time: sr.querySelector(".cur").textContent + " / " + sr.querySelector(".dur").textContent,
            seekDisabled: sr.querySelector(".seek").classList.contains("disabled"),
          };
        })(),
        rects: { feed: box(v), modal: box(v2) },
      });

      // Served as localhost we are the only thing loading the bundle. Served as
      // instagram.com (scripts/e2e.mjs maps the host to this server) the real
      // unpacked extension injects it, and loading it twice would build two bars.
      if (!/(^|\.)instagram\.com$/.test(location.hostname)) {
        const s = document.createElement("script");
        s.src = "/content.js";
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
